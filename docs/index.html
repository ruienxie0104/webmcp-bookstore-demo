<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>書庫示範系統 — Bookstore Inventory Demo</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#174c45">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&amp;family=Noto+Serif+TC:wght@600;700;900&amp;display=swap" rel="stylesheet">
<style>
:root{
  --ink:#202a27;--muted:#6e7771;--paper:#f5f0e5;--paper-deep:#ebe2d1;
  --surface:#fffdf8;--accent:#17685c;--accent-deep:#104c44;--gold:#c58a3a;
  --line:#ded5c5;--shadow:0 18px 50px rgba(42,51,46,.10);
}
*{box-sizing:border-box;margin:0;padding:0;}
html{background:var(--paper);scroll-behavior:smooth;}
body{
  min-height:100vh;color:var(--ink);font-family:"Noto Sans TC",sans-serif;
  background:
    radial-gradient(circle at 10% 8%,rgba(197,138,58,.10),transparent 25rem),
    linear-gradient(180deg,#f9f5ec 0,var(--paper) 38rem);
}
button{font:inherit;}
header{
  position:relative;overflow:hidden;min-height:290px;padding:44px max(28px,calc((100vw - 1180px)/2));
  display:flex;flex-direction:column;justify-content:center;color:#fff;
  background:linear-gradient(120deg,#103f3a 0%,#17685c 58%,#247c6d 100%);
}
header::before{
  content:"青鳥";position:absolute;right:-.04em;bottom:-.38em;color:rgba(255,255,255,.055);
  font:900 clamp(130px,24vw,330px)/1 "Noto Serif TC",serif;letter-spacing:-.16em;pointer-events:none;
}
.eyebrow{display:flex;align-items:center;gap:10px;margin-bottom:20px;font-size:12px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:#d9c092;}
.eyebrow::before{content:"";width:34px;height:1px;background:currentColor;}
header h1{position:relative;font:900 clamp(38px,6vw,68px)/1.2 "Noto Serif TC",serif;letter-spacing:.1em;text-shadow:0 4px 18px rgba(0,0,0,.16);}
header p{position:relative;max-width:580px;margin-top:16px;font-size:15px;line-height:1.9;color:rgba(255,255,255,.78);letter-spacing:.04em;}
header small{position:absolute;right:max(28px,calc((100vw - 1180px)/2));top:28px;color:rgba(255,255,255,.65);font-size:11px;}
nav{
  position:sticky;top:0;z-index:10;display:flex;gap:8px;padding:12px max(28px,calc((100vw - 1180px)/2));
  background:rgba(255,253,248,.88);border-bottom:1px solid rgba(222,213,197,.8);backdrop-filter:blur(14px);
}
nav button{position:relative;border:0;background:transparent;color:var(--muted);padding:11px 18px;border-radius:10px;cursor:pointer;font-size:14px;font-weight:600;transition:background .2s,color .2s,transform .2s;}
nav button:hover{background:#eee8dc;color:var(--accent-deep);transform:translateY(-1px);}
nav button:focus-visible{outline:3px solid rgba(197,138,58,.45);outline-offset:2px;}
nav button.active{background:var(--accent);color:#fff;box-shadow:0 7px 18px rgba(23,104,92,.22);}
main{width:min(1180px,calc(100% - 56px));min-height:400px;margin:0 auto;padding:46px 0 62px;}
main h2{font:700 clamp(25px,4vw,34px)/1.35 "Noto Serif TC",serif!important;letter-spacing:.05em;color:var(--accent-deep);}
main h2::after{content:"";display:block;width:36px;height:3px;margin-top:10px;border-radius:3px;background:var(--gold);}
main>div{display:flex;flex-wrap:wrap;gap:14px;margin:26px 0 20px;}
.card{
  position:relative;flex:1 1 190px;overflow:hidden;display:flex;align-items:baseline;justify-content:space-between;
  min-height:100px;margin:0;padding:22px 24px;background:var(--surface);border:1px solid rgba(222,213,197,.8);
  border-radius:18px;box-shadow:0 8px 30px rgba(42,51,46,.07);color:var(--muted);font-size:13px;font-weight:600;
}
.card::after{content:"";position:absolute;right:-22px;top:-25px;width:74px;height:74px;border-radius:50%;background:rgba(23,104,92,.07);}
.card b{font:700 32px/1 "Noto Serif TC",serif;color:var(--ink);}
table{display:block;width:100%;overflow-x:auto;border-collapse:separate;border-spacing:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);}
tbody{display:table;width:100%;min-width:720px;border-collapse:collapse;}
tr{transition:background .18s;}
tr:not(:first-child):nth-child(odd){background:#faf7f0;}
tr:not(:first-child):hover{background:#edf5f1;}
th,td{padding:15px 17px;text-align:left;font-size:13px;border-bottom:1px solid #e9e2d6;white-space:nowrap;}
tr:last-child td{border-bottom:0;}
th{background:#eee7da;color:#4d5a54;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;}
td:first-child{font-weight:600;color:var(--ink);}
.badge{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border:1px solid transparent;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.04em;}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;box-shadow:0 0 0 3px rgba(255,255,255,.55);}
.ok{background:#e0f0e9;color:#17685c;border-color:#c8e3d8;}
.low{background:#fbecd4;color:#9b611a;border-color:#edd3a9;}
.out{background:#f8dfda;color:#a23c34;border-color:#edc4bd;}
footer{padding:26px max(28px,calc((100vw - 1180px)/2)) 90px;border-top:1px solid var(--line);color:#8b8b82;font-size:11px;letter-spacing:.04em;}
#cart{position:fixed;right:24px;bottom:22px;z-index:12;background:var(--ink);color:#fff;padding:11px 18px;border:1px solid rgba(255,255,255,.14);border-radius:999px;box-shadow:0 12px 30px rgba(26,35,32,.25);font-size:13px;}
#cart b{color:#e3c08a;}
.console-launcher{
  position:fixed;right:24px;bottom:74px;z-index:30;display:flex;align-items:center;gap:9px;
  padding:12px 17px;border:1px solid rgba(255,255,255,.16);border-radius:999px;cursor:pointer;
  background:var(--accent-deep);color:#fff;box-shadow:0 14px 34px rgba(16,76,68,.3);font-size:13px;font-weight:700;
}
.console-launcher:hover{background:var(--accent);transform:translateY(-1px);}
.console-launcher:focus-visible,.console-close:focus-visible,.tool-button:focus-visible,.example-button:focus-visible,.console-run:focus-visible{
  outline:3px solid rgba(197,138,58,.55);outline-offset:2px;
}
.console-launcher-mark{font:700 14px/1 ui-monospace,SFMono-Regular,Menlo,monospace;color:#e3c08a;}
.console-shell[hidden]{display:none;}
.console-shell{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:24px;background:rgba(12,30,27,.64);backdrop-filter:blur(5px);}
.console-panel{
  width:min(1080px,100%);max-height:min(840px,calc(100vh - 48px));overflow:auto;border:1px solid #3c5d57;border-radius:20px;
  background:#12231f;color:#e9f0ed;box-shadow:0 30px 90px rgba(5,17,14,.48);font-family:"Noto Sans TC",sans-serif;
}
.console-header{position:sticky;top:0;z-index:2;display:flex;align-items:flex-start;justify-content:space-between;gap:18px;padding:24px 26px;border-bottom:1px solid #304b45;background:rgba(18,35,31,.96);backdrop-filter:blur(12px);}
.console-kicker{margin-bottom:7px;color:#d9c092;font:700 11px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.15em;text-transform:uppercase;}
.console-title-line{display:flex;flex-wrap:wrap;align-items:center;gap:12px;}
.console-title-line h2{font:700 25px/1.3 "Noto Serif TC",serif;color:#fff;}
.support-badge{display:inline-flex;align-items:center;gap:7px;padding:5px 10px;border:1px solid;border-radius:999px;font-size:11px;font-weight:700;}
.support-badge::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 10px currentColor;}
.support-badge.native{border-color:#3a846e;background:#173e34;color:#83d8ba;}
.support-badge.simulated{border-color:#8b6733;background:#3a2c19;color:#efbd70;}
.console-status-copy{margin-top:8px;color:#9db2aa;font-size:12px;line-height:1.6;}
.console-close{flex:0 0 auto;width:38px;height:38px;border:1px solid #3c5d57;border-radius:10px;cursor:pointer;background:#1b332d;color:#c7d6d1;font-size:22px;line-height:1;}
.console-body{display:grid;grid-template-columns:minmax(230px,.8fr) minmax(0,1.5fr);}
.console-sidebar{padding:22px;border-right:1px solid #304b45;}
.console-section-label{margin-bottom:11px;color:#819b92;font:700 10px/1.3 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.14em;text-transform:uppercase;}
.console-tools{display:grid;gap:9px;}
.tool-button{width:100%;padding:13px;border:1px solid #345149;border-radius:12px;cursor:pointer;background:#192e29;color:#dce8e4;text-align:left;transition:.18s;}
.tool-button:hover,.tool-button.active{border-color:#b68a4d;background:#233d36;}
.tool-name{display:block;color:#f3e2c4;font:700 12px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;overflow-wrap:anywhere;}
.tool-description{display:block;margin-top:5px;color:#9eb1aa;font-size:11px;line-height:1.55;}
.schema-summary{display:block;margin-top:7px;color:#6fae9d;font:500 10px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;overflow-wrap:anywhere;}
.console-examples{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px;}
.example-button{max-width:100%;padding:7px 9px;border:1px solid #425c55;border-radius:8px;cursor:pointer;background:transparent;color:#b8cbc4;font:500 10px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;text-align:left;overflow-wrap:anywhere;}
.example-button:hover{border-color:#b68a4d;color:#f0d6a9;}
.console-history{display:grid;gap:7px;list-style:none;}
.history-item{padding:9px 10px;border-left:2px solid #49675f;background:#192c27;color:#9fb3ac;font:500 10px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;overflow-wrap:anywhere;}
.history-item strong{display:block;color:#d6e3de;font-weight:600;}
.history-empty{color:#708b82;font-size:11px;line-height:1.6;}
.console-workspace{min-width:0;padding:22px 24px 26px;}
.console-workspace h3{color:#f3e2c4;font:700 15px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;overflow-wrap:anywhere;}
.console-workspace-description{margin:7px 0 18px;color:#a7bbb4;font-size:12px;line-height:1.7;}
.parameter-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px;}
.parameter-field{display:grid;gap:6px;}
.parameter-field label{color:#cad8d3;font:600 11px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;}
.required-mark{margin-left:5px;color:#efbd70;font-family:"Noto Sans TC",sans-serif;}
.parameter-field small{color:#718d84;font-size:10px;line-height:1.5;}
.parameter-field input,.parameter-field select{width:100%;padding:10px 11px;border:1px solid #3b5a52;border-radius:9px;background:#0d1c18;color:#e6eeeb;font:500 12px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;}
.parameter-field input:focus,.parameter-field select:focus{outline:2px solid #b68a4d;border-color:transparent;}
.no-parameters{padding:13px;border:1px dashed #3b5a52;border-radius:10px;color:#7f9990;font:500 11px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;}
.console-run{margin-top:16px;padding:10px 20px;border:0;border-radius:9px;cursor:pointer;background:#c58a3a;color:#13231f;font-size:12px;font-weight:800;}
.console-run:hover{background:#dda554;}
.console-run:disabled{cursor:wait;opacity:.65;}
.response-label{display:flex;align-items:center;justify-content:space-between;margin-top:23px;margin-bottom:8px;color:#819b92;font:700 10px/1.3 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.12em;text-transform:uppercase;}
.response-output{min-height:190px;overflow:auto;padding:17px;border:1px solid #2d4941;border-radius:12px;background:#07130f;color:#a9dfc8;font:500 12px/1.65 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap;tab-size:2;}
@media (max-width:700px){
  header{min-height:250px;padding:50px 22px 34px;}
  header small{position:static;order:-1;margin-bottom:28px;line-height:1.6;}
  header p{font-size:13px;}.eyebrow{margin-bottom:14px;}
  nav{padding:10px 14px;overflow-x:auto;}nav button{flex:1 0 auto;padding:10px 13px;}
  main{width:calc(100% - 28px);padding:34px 0 50px;}
  main>div{display:grid;grid-template-columns:1fr 1fr;gap:10px;}.card{min-height:86px;padding:17px;}.card:last-child{grid-column:1/-1;}
  th,td{padding:13px 14px;}footer{padding-left:18px;padding-right:18px;line-height:1.8;}
  #cart{right:14px;bottom:14px;}
  .console-launcher{right:14px;bottom:66px;}
  .console-shell{padding:0;place-items:stretch;}
  .console-panel{width:100%;max-height:100vh;border:0;border-radius:0;}
  .console-header{padding:17px 16px;}.console-title-line h2{font-size:21px;}
  .console-body{grid-template-columns:1fr;}.console-sidebar{padding:16px;border-right:0;border-bottom:1px solid #304b45;}
  .console-tools{grid-template-columns:1fr;}.console-workspace{padding:18px 16px 22px;}.parameter-grid{grid-template-columns:1fr;}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important;}}
</style>
</head>
<body>
<header>
  <span class="eyebrow">Independent Bookstore Archive</span>
  <h1>書庫示範系統</h1>
  <p>把每一本書安放在對的位置。從庫存、訂單到書目，以清晰而安靜的方式掌握書店日常。</p>
  <small>示範網站 — 供 WebMCP 練習用 · 所有資料為虛構</small>
</header>
<nav aria-label="主要功能">
  <button class="active" data-page="inventory">庫存總覽</button>
  <button data-page="orders">訂單</button>
  <button data-page="titles">書目資料</button>
</nav>
<main id="app"></main>
<footer>Bookstore Inventory Demo · vanilla JS SPA · 無後端（模擬資料）· WebMCP enabled</footer>
<div id="cart">🛒 待出貨：<b id="cart-n">0</b></div>
<button id="console-launcher" class="console-launcher" type="button" aria-haspopup="dialog" aria-controls="agent-console" aria-expanded="false">
  <span class="console-launcher-mark">&gt;_</span> Agent Console
</button>
<div id="agent-console" class="console-shell" hidden>
  <section class="console-panel" role="dialog" aria-modal="true" aria-labelledby="console-title">
    <div class="console-header">
      <div>
        <div class="console-kicker">WebMCP inspector</div>
        <div class="console-title-line">
          <h2 id="console-title">Agent Console</h2>
          <span id="support-badge" class="support-badge simulated">偵測中</span>
        </div>
        <p id="console-status-copy" class="console-status-copy">正在讀取頁面工具介面…</p>
      </div>
      <button id="console-close" class="console-close" type="button" aria-label="關閉 Agent Console">×</button>
    </div>
    <div class="console-body">
      <aside class="console-sidebar">
        <div class="console-section-label">Available tools</div>
        <div id="console-tools" class="console-tools"></div>
        <div class="console-section-label" style="margin-top:22px">Examples</div>
        <div id="console-examples" class="console-examples"></div>
        <div class="console-section-label" style="margin-top:22px">Recent calls · 5 max</div>
        <ol id="console-history" class="console-history"></ol>
      </aside>
      <section id="console-workspace" class="console-workspace"></section>
    </div>
  </section>
</div>

<script src="./webmcp.js"></script>
<script>
// ---------- 模擬資料域（window.DB；webmcp.js 讀這裡） ----------
window.DB = {
  titles: {
    "T-101":{isbn:"9789573318301",title:"夜行的鳥",author:"劉梓潔",price:320,cat:"文學"},
    "T-102":{isbn:"9786263106172",title:"雜訊",author:"諾爾·蓋格",price:450,cat:"科普"},
    "T-103":{isbn:"9789570873346",title:"地熱之屋",author:"王聰威",price:380,cat:"文學"},
    "T-104":{isbn:"9789865256744",title:"演算法圖鑑",author:"石田保輝",price:520,cat:"技術"},
    "T-105":{isbn:"9789570530690",title:"海風的顏色",author:"川端芽衣",price:299,cat:"兒童"}
  },
  stock: {
    "T-101":{qty:14,shelf:"A-3"},
    "T-102":{qty:3, shelf:"B-1"},
    "T-103":{qty:0, shelf:"A-7"},
    "T-104":{qty:8, shelf:"C-2"},
    "T-105":{qty:21,shelf:"D-1"}
  },
  orders: [
    {id:"K-201",title:"T-102",qty:2,status:"pending"},
    {id:"K-202",title:"T-104",qty:1,status:"shipped"}
  ]
};
const LOW_T = 5;
function shelfStatus(q){ return q<=0?"out":(q<LOW_T?"low":"ok"); }

// ---------- UI ----------
const pages = {
  inventory(){
    let rows = Object.entries(DB.stock).map(([id,s])=>{
      const t = DB.titles[id];
      const st = shelfStatus(s.qty);
      return `<tr><td>${t.title}</td><td>${t.isbn}</td><td>${t.cat}</td><td>${s.shelf}</td>
      <td><b>${s.qty}</b></td><td><span class="badge ${st}">${st==='ok'?'充足':st==='low'?'偏低':'缺書'}</span></td></tr>`;
    }).join("");
    return `<h2 style="margin-bottom:12px">庫存總覽</h2>
    <div><span class="card">書目 <b>${Object.keys(DB.titles).length}</b> 種</span>
    <span class="card">全庫 <b>${Object.values(DB.stock).reduce((a,s)=>a+s.qty,0)}</b> 本</span>
    <span class="card">偏低/缺書 <b>${Object.values(DB.stock).filter(s=>shelfStatus(s.qty)!=='ok').length}</b> 項</span></div>
    <table><tr><th>書名</th><th>ISBN</th><th>分類</th><th>書架</th><th>庫存</th><th>狀態</th></tr>${rows}</table>`;
  },
  orders(){
    let rows = DB.orders.map(o=>{
      const t = DB.titles[o.title];
      return `<tr><td>${o.id}</td><td>${t?DB.titles[o.title].title:o.title}</td><td>${o.qty}</td>
      <td>${o.status==='pending'?'<span class="badge low">待出貨</span>':'<span class="badge ok">已出</span>'}</td></tr>`;
    }).join("");
    return `<h2 style="margin-bottom:12px">訂單</h2>
    <table><tr><th>單號</th><th>書名</th><th>冊數</th><th>狀態</th></tr>${rows}</table>`;
  },
  titles(){
    let rows = Object.entries(DB.titles).map(([id,t])=>{
      const s = DB.stock[id];
      return `<tr><td>${id}</td><td>${t.title}</td><td>${t.author}</td><td>${t.isbn}</td><td>$${t.price}</td><td>${t.cat}</td><td>${s.shelf}</td></tr>`;
    }).join("");
    return `<h2 style="margin-bottom:12px">書目資料</h2>
    <table><tr><th>ID</th><th>書名</th><th>作者</th><th>ISBN</th><th>定價</th><th>分類</th><th>書架</th></tr>${rows}</table>`;
  }
};
let cart = 0;
function go(p){
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===p));
  document.getElementById("app").innerHTML = pages[p]();
  history.pushState({page:p},"", "#"+p);
}
document.querySelectorAll("nav button").forEach(b=>b.addEventListener("click",()=>go(b.dataset.page)));
addEventListener("popstate",()=>{ const p = (location.hash||"#inventory").slice(1); if(pages[p]) go(p);});
go(location.hash.slice(1) || "inventory");
</script>
<script src="./agent-console.js"></script>
</body>
</html>
